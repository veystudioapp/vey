      <rect x="944" y="420" width="40" height="40" rx="10" fill="#B49BFF" fill-opacity="0.16"/>
      <g transform="translate(952,428)" fill="none" stroke="#B49BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 l5 5 -5 5 M12 18 h8"/></g>
      <text x="944" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Terminal</text>
      <text x="944" y="514" font-size="12.5" fill="#A99FCB">A shell docked under every pane</text>
