<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Vey — put a team of Claude agents to work</title>
  <!--
    The home page's hero (web/.vitepress/theme/home/Home.vue) as a picture for
    the README: its palette (site.css), its haze, its chip, its headline with
    the serif-italic accent, and its three spotlights as cells sharing their
    borders. The words are copy.ts' — change them there first.
  -->

  <defs>
    <radialGradient id="sky">
      <stop offset="0" stop-color="#7C5CF6" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#4C34A0" stop-opacity="0.14"/>
      <stop offset="0.8" stop-color="#4C34A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#09090C"/>
  <!-- site.css' .sky: 1100px × 560px at 50% -120px -->
  <ellipse cx="640" cy="-120" rx="1100" ry="560" fill="url(#sky)"/>
  <!-- the hairline arc over the chip -->
  <ellipse cx="640" cy="-420" rx="1000" ry="530" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- the logo: resources/mark.svg beside the wordmark -->
  <svg x="584" y="58" width="44" height="28.5" viewBox="6 21.5 88 57" fill="none">
    <g stroke="#F4F4F5" stroke-width="13"><path d="M6 72H34L62 28H94"/><path d="M6 28H22"/><path d="M78 72H94"/></g>
  </svg>
  <text x="638" y="84" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#F4F4F5">Vey</text>

  <!-- the chip -->
  <rect x="455" y="128" width="370" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <path d="M480 136 l2.2 5.8 5.8 2.2 -5.8 2.2 -2.2 5.8 -2.2 -5.8 -5.8 -2.2 5.8 -2.2z" fill="#F4F4F5"/>
  <text x="652" y="149.5" text-anchor="middle" font-size="14" fill="#C9C9D1">Agent-first desktop studio for Claude Code</text>

  <!-- the headline -->
  <text x="640" y="246" text-anchor="middle" font-size="60" font-weight="500" letter-spacing="-2.6" fill="#F4F4F5">Put a team of Claude agents <tspan font-family="ui-serif, 'New York', 'Iowan Old Style', Charter, Cambria, Georgia, serif" font-style="italic" font-weight="400" letter-spacing="-1.2" fill="#D8D4EA">to work.</tspan></text>

  <text x="640" y="296" text-anchor="middle" font-size="18" fill="#8E8E99">Every task its own agent — in your files, a terminal and a real browser.</text>
  <text x="640" y="322" text-anchor="middle" font-size="18" fill="#8E8E99">Every change in one diff to review, commit and push.</text>

  <!-- the spotlights, as cells sharing their borders -->
  <g>
    <rect x="100" y="380" width="1080" height="168" rx="10" fill="#0F0F13" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <path d="M460 380 V548 M820 380 V548" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <text x="128" y="416" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#C4B5FD">01 · PARALLEL</text>
    <text x="128" y="452" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#F4F4F5">Every task, its own agent</text>
    <text x="128" y="486" font-size="14" fill="#8E8E99">Needs you, Running and Recent —</text>
    <text x="128" y="508" font-size="14" fill="#8E8E99">look only where you're needed.</text>

    <text x="488" y="416" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#C4B5FD">02 · BROWSER</text>
    <text x="488" y="452" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#F4F4F5">It checks its own work</text>
    <text x="488" y="486" font-size="14" fill="#8E8E99">A real browser beside every chat:</text>
    <text x="488" y="508" font-size="14" fill="#8E8E99">navigate, click, type, screenshot.</text>

    <text x="848" y="416" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#C4B5FD">03 · REVIEW</text>
    <text x="848" y="452" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#F4F4F5">Read the diff. Push.</text>
    <text x="848" y="486" font-size="14" fill="#8E8E99">Stage file by file, a commit</text>
    <text x="848" y="508" font-size="14" fill="#8E8E99">message drafted from what's staged.</text>
  </g>

  <text x="640" y="596" text-anchor="middle" font-size="14" fill="#5F5F69">macOS · Windows · Linux  ·  open source, MIT licensed</text>
</svg>
