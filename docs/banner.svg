<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Vey — Claude Code and your editor, in one app</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0912"/>
      <stop offset="0.55" stop-color="#100E1F"/>
      <stop offset="1" stop-color="#0B0A16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFA" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#5B3FE8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5B3FE8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="640" cy="200" rx="420" ry="240" fill="url(#glow)"/>

  <!-- the mark: resources/logo.svg, inlined -->
  <rect x="572" y="84" width="136" height="136" rx="34" fill="#FFFFFF" fill-opacity="0.16" filter="url(#soft)"/>
  <svg x="568" y="80" width="144" height="144" viewBox="0 0 100 100" fill="none">
    <rect width="100" height="100" rx="22.5" fill="#000000"/>
    <g transform="translate(9.09 9.09) scale(0.8182)" stroke="#FFFFFF" stroke-width="13"><path d="M6 72H34L62 28H94"/><path d="M6 28H22"/><path d="M78 72H94"/></g>
    <rect x="0.5" y="0.5" width="99" height="99" rx="22" stroke="#808080" stroke-opacity="0.3"/>
  </svg>

  <!-- the wordmark: resources/mark.svg at the cap height in the text's own white, then "Vey" -->
  <svg x="567" y="264" width="49" height="32" viewBox="6 21.5 88 57" fill="none">
    <g stroke="#FFFFFF" stroke-width="13"><path d="M6 72H34L62 28H94"/><path d="M6 28H22"/><path d="M78 72H94"/></g>
  </svg>
  <text x="629" y="296" font-size="44" font-weight="700" letter-spacing="1" fill="#FFFFFF">Vey</text>
  <text x="640" y="336" text-anchor="middle" font-size="19" fill="#B6ABD8">Claude Code and your editor, in one app.</text>

    <g>
      <rect x="108" y="400" width="248" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="128" y="420" width="40" height="40" rx="10" fill="#D97757" fill-opacity="0.16"/>
      <g transform="translate(136,428)" fill="none" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 a3 3 0 0 1 3 -3 h12 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-7 l-5 4 v-4 a3 3 0 0 1 -3 -3z"/></g>
      <text x="128" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Chats</text>
      <text x="128" y="514" font-size="12.5" fill="#A99FCB">Many claude sessions, one per tab</text>
    </g>
    <g>
      <rect x="380" y="400" width="248" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="400" y="420" width="40" height="40" rx="10" fill="#1F9CF0" fill-opacity="0.16"/>
      <g transform="translate(408,428)" fill="none" stroke="#1F9CF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 l-6 6 6 6 M16 6 l6 6 -6 6"/></g>
      <text x="400" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Editor</text>
      <text x="400" y="514" font-size="12.5" fill="#A99FCB">Every file, 140+ languages</text>
    </g>
    <g>
      <rect x="652" y="400" width="248" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="672" y="420" width="40" height="40" rx="10" fill="#5FD08A" fill-opacity="0.16"/>
      <g transform="translate(680,428)" fill="none" stroke="#5FD08A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M2 12 h6 M16 12 h6"/></g>
      <text x="672" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Diff &amp; Commit</text>
      <text x="672" y="514" font-size="12.5" fill="#A99FCB">Review, stage, AI-drafted message</text>
